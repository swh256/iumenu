name: refresh menu

on:
  schedule:
    # 每天 10:00 UTC = 夏令时早 6 点 / 冬令时早 5 点(ET)。
    # cron 只认 UTC,所以换季时刻会差一小时,对这个用途无所谓。
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # 把新菜单 commit 回 main
  pages: write      # 发布 Pages
  id-token: write   # deploy-pages 要的 OIDC

# 抓数据和发布放在同一个 job 里跑完。
# 分成两个 workflow 是不行的:GITHUB_TOKEN 推的 commit 不会触发别的 workflow,
# 每天那次机器人提交就永远不会带动 Pages 部署。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 抓菜单
        run: python3 build.py

      - name: 有变化才提交
        run: |
          if git diff --quiet -- data/menu.json; then
            echo "菜单没变,不提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menu.json
          git commit -m "menu: $(date -u +%Y-%m-%d)"
          git push

      # enablement 只在仓库还没开 Pages 时尝试开启,而且按文档要非 GITHUB_TOKEN 的 token;
      # 已经开在「从分支部署」上时它不会切成 Actions 部署 —— 那得去 Settings → Pages → Source
      # 手动选 GitHub Actions,否则每次 push 还会多跑一个 pages-build-deployment 跟这里抢部署。
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      # v4 起默认不打包点文件,.nojekyll 不会进 artifact。无所谓:
      # Actions 部署不跑 Jekyll,站点里也没有下划线开头的文件。
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v5

      # 放在部署之后:即使上游改了结构,菜单该更新还是更新、站点该发还是发,
      # 但这次运行会变红并发邮件。2026-09 那次 IU 换 DisplayConcept 的键,
      # 就是因为没有这一步,静默坏了一整天都没人知道。
      - name: 有警告就把这次运行标红
        run: |
          python3 - <<'PY'
          import json, sys
          warnings = json.load(open("data/menu.json")).get("warnings") or []
          for w in warnings:
              print(f"::error::{w}")
          sys.exit(1 if warnings else 0)
          PY
