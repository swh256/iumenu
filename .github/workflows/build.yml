name: refresh menu

on:
  schedule:
    # 每天 10:00 UTC = 夏令时早 6 点 / 冬令时早 5 点(ET)。
    # cron 只认 UTC,所以换季时刻会差一小时,对这个用途无所谓。
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # 把新菜单 commit 回 main
  pages: write      # 发布 Pages
  id-token: write   # deploy-pages 要的 OIDC

# 抓数据和发布放在同一个 job 里跑完。
# 分成两个 workflow 是不行的:GITHUB_TOKEN 推的 commit 不会触发别的 workflow,
# 每天那次机器人提交就永远不会带动 Pages 部署。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓菜单
        run: python3 build.py

      - name: 有变化才提交
        run: |
          if git diff --quiet -- data/menu.json; then
            echo "菜单没变,不提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menu.json
          git commit -m "menu: $(date -u +%Y-%m-%d)"
          git push

      # enablement: 如果仓库还没开 Pages(或者开在"从分支部署"上),
      # 这一步会直接用 API 把它切成 Actions 部署,不用去 Settings 里点。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
