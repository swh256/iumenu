<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Where to Eat Today</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#990000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --crimson:#990000; --bg:#f6f5f3; --card:#fff; --ink:#1a1a1a; --dim:#6b6660;
    --line:#e3ded7; --chip:#ece8e2; --ok:#1a7f4b; --shut:#a33; --warnbg:#fdf3e3;
    --warnink:#7a5209; --warnline:#e8d5ae;
  }
  @media (prefers-color-scheme:dark){
    :root{ --crimson:#e05a5a; --bg:#151412; --card:#1f1e1c; --ink:#ece9e4; --dim:#9a938a;
           --line:#332f2b; --chip:#2b2825; --ok:#4ec98a; --shut:#e08080;
           --warnbg:#2e2617; --warnink:#e8c07a; --warnline:#4a3d22; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system,BlinkMacSystemFont,
    "Segoe UI","Helvetica Neue",Arial,sans-serif;
    padding:max(12px,env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1100px;margin:0 auto}

  header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  h1{font-size:19px;margin:0;letter-spacing:.2px}
  h1 b{color:var(--crimson)}
  .stamp{font-size:12px;color:var(--dim);margin-left:auto}

  .banner{background:var(--warnbg);color:var(--warnink);border:1px solid var(--warnline);
          border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.45;margin:10px 0 0}

  .meals{display:flex;gap:6px;margin:12px 0 10px}
  .meals button{
    flex:1;padding:9px 0;font-size:15px;font-weight:600;border:1px solid var(--line);
    background:var(--card);color:var(--dim);border-radius:10px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .meals button[aria-pressed="true"]{background:var(--crimson);border-color:var(--crimson);color:#fff}

  .days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;
        scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .days button{
    flex:0 0 auto;min-width:58px;padding:6px 10px;border:1px solid var(--line);
    background:var(--card);color:var(--dim);border-radius:9px;cursor:pointer;
    font:inherit;font-size:12px;line-height:1.25;text-align:center;
    -webkit-tap-highlight-color:transparent;
  }
  .days button b{display:block;font-size:15px;color:var(--ink)}
  .days button[aria-pressed="true"]{border-color:var(--crimson);background:var(--chip)}
  .days button[aria-pressed="true"] b{color:var(--crimson)}
  .days button[data-shut="1"]{opacity:.45}

  .halls{display:grid;gap:12px;grid-template-columns:1fr}
  @media (min-width:760px){ .halls{grid-template-columns:repeat(3,1fr);align-items:start} }
  .hall{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
  .hall h2{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
  .near{font-size:10px;font-weight:700;color:#fff;background:var(--crimson);
        border-radius:4px;padding:1px 5px;letter-spacing:.4px;text-transform:uppercase}
  .hrs{font-size:12px;color:var(--dim);margin:3px 0 0}
  .hrs .open{color:var(--ok);font-weight:600}
  .hrs .closed{color:var(--shut);font-weight:600}

  .station{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
  .station:first-of-type{border-top:0;padding-top:4px}
  .station h3{margin:0 0 5px;font-size:12px;font-weight:700;letter-spacing:.6px;
              text-transform:uppercase;color:var(--crimson)}
  ul{margin:0;padding:0;list-style:none}
  /* 荤素标记占据行首那一栏,所以不用再画 bullet,左边缘也是齐的 */
  li{padding:2px 0 2px 24px;position:relative;font-size:15px}
  li .k{position:absolute;left:0;top:3px;width:17px;font-size:12px;line-height:1.5;
        text-align:center;opacity:.85}
  li .k.unknown{opacity:1}
  li .k.unknown::before{content:"";display:inline-block;width:4px;height:4px;
        border-radius:50%;background:var(--line);vertical-align:middle}

  .empty{color:var(--dim);font-size:14px;margin-top:10px}
  .note{font-size:12px;color:var(--dim);background:var(--chip);border-radius:8px;
        padding:6px 9px;margin-top:10px;line-height:1.4}
  footer{margin-top:20px;font-size:11px;color:var(--dim);text-align:center;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Where to <b>Eat Today</b></h1>
    <span class="stamp" id="stamp"></span>
  </header>

  <div id="banner"></div>

  <div class="meals" id="meals">
    <button type="button" data-meal="lunch">Lunch</button>
    <button type="button" data-meal="dinner">Dinner</button>
  </div>

  <div class="days" id="days"></div>
  <div class="halls" id="halls"></div>

  <footer>
    🥩 meat &nbsp;·&nbsp; 🌱 vegetarian &nbsp;·&nbsp; unmarked = not tagged by IU<br>
    Menus from IU Dining (Nutrislice), hours from dining.indiana.edu. Refreshed daily.<br>
    Only stations that rotate daily — salad bars, yogurt bars, bakery cases
    and topping counters are left out.
  </footer>
</div>

<script>
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MARK = { meat: "🥩", veg: "🌱" };

// "Today" comes from the phone's own clock, never from the data file. The build
// stamps its own date in, and if the daily refresh is late or fails that stamp is
// yesterday — which used to make the page label yesterday as "Today".
const TODAY = (() => {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
})();

let DATA = null, day = null, meal = null;

// Three states, not two. A hall with no hours data is NOT closed — that used to
// hide every menu on the site whenever the hours scrape broke.
function hoursFor(hall, date){
  const h = hall.hours;
  if (!h || !h[date]) return {state:"unknown", text:"Hours unavailable"};
  const t = h[date].trim();
  if (/^closed$/i.test(t)) return {state:"closed", text:"Closed today"};
  return {state:"open", text:t};
}

// Before 3pm you're deciding about lunch; after that, dinner.
const pickMeal = () => new Date().getHours() < 15 ? "lunch" : "dinner";

const esc = s => String(s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderBanner(){
  const box = document.getElementById("banner");
  const msgs = [];
  if (!DATA.dates.includes(TODAY)) {
    msgs.push(`This menu was built for ${DATA.today} and doesn't cover today ` +
              `(${TODAY}). The daily refresh may have failed.`);
  }
  if (DATA.halls.some(h => !h.hours)) {
    msgs.push("Opening hours couldn't be fetched for some halls — menus below are " +
              "still accurate, but check the hall is open before you walk over.");
  }
  box.innerHTML = msgs.map(m => `<p class="banner">${esc(m)}</p>`).join("");
}

function renderDays(){
  const box = document.getElementById("days");
  box.innerHTML = "";
  DATA.dates.forEach(d => {
    // Only grey out a day when every hall is *known* to be closed.
    const allShut = DATA.halls.every(h => hoursFor(h, d).state === "closed");
    const dt = new Date(d + "T12:00:00");
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.shut = allShut ? "1" : "0";
    b.setAttribute("aria-pressed", d === day);
    b.innerHTML = `${d === TODAY ? "Today" : WD[dt.getDay()]}` +
                  `<b>${dt.getMonth()+1}/${dt.getDate()}</b>`;
    b.onclick = () => { day = d; render(); };
    box.appendChild(b);
  });
}

function renderHalls(){
  const box = document.getElementById("halls");
  box.innerHTML = "";
  DATA.halls.forEach((hall, i) => {
    const d = DATA.days[day][hall.key];
    const hrs = hoursFor(hall, day);

    // A station can show up in both the meal bucket and the all-day bucket;
    // merge them so its heading is not printed twice.
    const groups = [];
    if (hrs.state !== "closed") {
      const byStation = new Map();
      [...(d[meal] || []), ...(d.allday || [])].forEach(g => {
        const cur = byStation.get(g.station);
        if (cur) cur.items.push(...g.items);
        else { const m = {station: g.station, items: [...g.items]}; byStation.set(g.station, m); groups.push(m); }
      });
      groups.forEach(g => {
        const seen = new Set();
        g.items = g.items.filter(it => !seen.has(it.name) && seen.add(it.name));
      });
    }

    const cls = {open:"open", closed:"closed", unknown:""}[hrs.state];
    const el = document.createElement("section");
    el.className = "hall";
    el.innerHTML = `
      <h2>${esc(hall.name)}${i === 0 ? '<span class="near">Closest</span>' : ""}</h2>
      <p class="hrs">${cls ? `<span class="${cls}">${esc(hrs.text)}</span>`
                           : esc(hrs.text)}</p>`;

    if (hrs.state !== "closed") {
      if (!groups.length) {
        el.insertAdjacentHTML("beforeend", '<p class="empty">No menu posted yet.</p>');
      } else {
        groups.forEach(g => {
          const s = document.createElement("div");
          s.className = "station";
          s.innerHTML = `<h3>${esc(g.station)}</h3><ul>` + g.items.map(it => {
            const m = MARK[it.kind];
            const mark = m ? `<span class="k" title="${esc(it.kind)}">${m}</span>`
                           : '<span class="k unknown" title="not tagged"></span>';
            return `<li>${mark}${esc(it.name)}</li>`;
          }).join("") + "</ul>";
          el.appendChild(s);
        });
        if (!d.split) el.insertAdjacentHTML("beforeend",
          '<p class="note">IU hasn\'t split this day into lunch and dinner yet — ' +
          'this is everything served that day. It gets split closer to the date.</p>');
      }
    }
    box.appendChild(el);
  });
}

function render(){
  document.querySelectorAll("#meals button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.meal === meal));
  renderBanner();
  renderDays();
  renderHalls();
}

document.querySelectorAll("#meals button").forEach(b =>
  b.onclick = () => { meal = b.dataset.meal; render(); });

fetch("data/menu.json?" + Date.now())
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(j => {
    DATA = j;
    // Land on today; if the data is stale, land on the soonest day it does cover.
    day = j.dates.includes(TODAY) ? TODAY
        : (j.dates.find(d => d >= TODAY) || j.dates[j.dates.length - 1]);
    meal = pickMeal();
    const age = Math.round((Date.now() - new Date(j.generated_at)) / 36e5);
    document.getElementById("stamp").textContent =
      age < 1 ? "just updated" : age < 48 ? `updated ${age}h ago`
                                          : `updated ${Math.round(age/24)}d ago`;
    render();
  })
  .catch(e => {
    document.getElementById("halls").innerHTML =
      `<p class="empty">Couldn't load the menu (${esc(e)}). ` +
      `The daily refresh may have failed.</p>`;
  });
</script>
</body>
</html>
